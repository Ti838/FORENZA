publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.2
  supabase_flutter: ^2.5.6
  crypto: ^3.0.3
  intl: ^0.19.0
  qr_flutter: ^4.1.0
