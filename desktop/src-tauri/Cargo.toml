[package]
name = "forenza-desktop"
version = "1.0.0"
description = "FORENZA — Forensic Evidence Chain of Custody Desktop Application"
authors = ["FORENZA Systems Architecture"]
edition = "2021"

[lib]
name = "forenza_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
