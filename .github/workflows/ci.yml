name: FORENZA CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    name: Build, Lint, Typecheck & Cryptographic Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint || true

      - name: Run Complete 18-Suite Forensic Cryptographic Test Matrix
        run: npm test -- --coverage
        env:
          FORENZA_QR_JWT_SECRET: ci_test_qr_secret_must_be_at_least_32_characters_long
          FORENZA_HANDOVER_JWT_SECRET: ci_test_handover_secret_32_bytes_length_secure

      - name: Verify Web Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon_key_ci_mock
          SUPABASE_SERVICE_ROLE_KEY: service_role_key_ci_mock
          FORENZA_QR_JWT_SECRET: ci_test_qr_secret_must_be_at_least_32_characters_long
          FORENZA_HANDOVER_JWT_SECRET: ci_test_handover_secret_32_bytes_length_secure
